# systematic_stockrate_djia — DJIA single-ticker systematic stock rating.
#
# Ported from delorean-next/strategy-packages/systematic_stockrate_djia. One
# agent call per (decision_date, ticker) — the single-ticker pattern — scored
# with single_name_ir (pooled per-name IR, no cross-sectional breadth needed).
#
# mission.md and output_schema.json are lifted verbatim from the delorean
# package; the output contract is the same submit_views shape.
#
# Data surface matches Delorean OptimizedAgent (configs/optimized_agent_full.yaml):
#   quantitative specialist ← prices + fundamentals + ratios
#   qualitative specialist  ← news + filing_text + web_search
# The package binds the full surface; the adapter partitions kinds per role.
# Fintel does not need platform changes for that split — ToolSurface.subset /
# selective access.read in the adapter owns it.

schema_version = 1
name = "systematic_stockrate_djia"
description = "Score each DJIA-30 constituent independently, quarterly, scored via pooled single-name IR."

[universe]
preset = "dow30"

[decision]
scope = "single_name"
schedule = { kind = "custom_dates", start = "2022-07-01", end = "2026-04-01", dates = [
    "2022-07-01", "2022-10-01", "2023-01-01", "2023-04-01",
    "2023-07-01", "2023-10-01", "2024-01-01", "2024-04-01",
    "2024-07-01", "2024-10-01", "2025-01-01", "2025-04-01",
    "2025-07-01", "2025-10-01", "2026-01-01", "2026-04-01",
] }

# ── quantitative lane ───────────────────────────────────────────────────────
[[data]]
kind = "prices"
source = "massive_prices"
lookback_days = 365

[[data]]
kind = "fundamentals"
source = "massive_fundamentals"
lookback_days = 720

[[data]]
kind = "ratios"
source = "valuation_ratios"
window_days = 365
lookback_days = 365

# ── qualitative lane ────────────────────────────────────────────────────────
[[data]]
kind = "news"
source = "massive_news"
lookback_days = 50

[[data]]
kind = "filing_text"
source = "massive_filing_text"
lookback_days = 800
forms = ["10-K"]
sections = ["business"]

[[data]]
kind = "web_search"
source = "web_search"
lookback_days = 50
max_results = 5

[scoring]
# The signal: how the decision's metrics become THE signal. For a single-name
# strategy the view's score is the signal. The platform owns the mechanics
# around it (transform, ensemble, holdings); the package owns what the
# signal *is*. See docs/architecture.md §1 + the evaluation layer.
signal = "single_name"
# The KPI: what "good" means over signal + prices. single_name_ir reports raw
# cross-sectional IC (Spearman, per decision-date grid) plus net-of-cost
# returns from the holdings layer.
kpi = "single_name_ir"
metric_key = "icir"
transform = "single_name"
horizons = [1, 2, 3, 4]
params = { holdings = true, active_budget = 0.5, cost_bps = 5.0 }

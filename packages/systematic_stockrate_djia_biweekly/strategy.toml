# systematic_stockrate_djia_biweekly — DJIA single-ticker systematic stock rating,
# biweekly assessment cadence, fundamental attractiveness + trajectory view.
#
# Sibling of systematic_stockrate_djia_weekly / _monthly. Same single-ticker
# pattern, mission pillars, data surface, and output contract — intentional
# differences are date / horizon only:
#   * the decision grid is biweekly (every other Friday, holiday-snapped
#     forward) over 2025-06-06 .. 2026-08-14 — the cadence of assessment,
#     not the view horizon. 32 dates, ending the last trading Friday as of
#     package creation (2026-08-14).
#   * scoring horizons are decision-date-grid steps (fortnights): [1, 2, 4, 8]
#   * mission pillar-3 language is weeks-to-quarter (monthly package uses
#     months-to-quarter)
#
# Data surface partitioning (adapter owns):
#   quantitative specialist ← prices + fundamentals + ratios + macro + news_sentiment
#   qualitative specialist  ← news + web_search

schema_version = 1
name = "systematic_stockrate_djia_biweekly"
description = "Score each DJIA-30 constituent independently, biweekly (2025-06-06 to 2026-08-14), scored via pooled single-name IR."

[universe]
preset = "dow30"

[decision]
scope = "single_name"
# Biweekly Fridays over 2025-06-06 .. 2026-08-14, snapped forward to the next
# trading day when the Friday is an NYSE holiday (Independence Day 2025-07-04
# → 2025-07-07; Juneteenth 2026-06-19 → 2026-06-22; observed Independence Day
# 2026-07-03 → 2026-07-06). There is no builtin `biweekly` schedule kind, so
# the grid is expressed as custom_dates; the dates are the source of truth —
# `--start/--end` may narrow but not widen them.
schedule = { kind = "custom_dates", start = "2025-06-06", end = "2026-08-14", dates = [
    "2025-06-06", "2025-06-20", "2025-07-07", "2025-07-18", "2025-08-01", "2025-08-15",
    "2025-08-29", "2025-09-12", "2025-09-26", "2025-10-10", "2025-10-24", "2025-11-07",
    "2025-11-21", "2025-12-05", "2025-12-19", "2026-01-02", "2026-01-16", "2026-01-30",
    "2026-02-13", "2026-02-27", "2026-03-13", "2026-03-27", "2026-04-10", "2026-04-24",
    "2026-05-08", "2026-05-22", "2026-06-05", "2026-06-22", "2026-07-06", "2026-07-17",
    "2026-07-31", "2026-08-14",
] }

# ── quantitative lane ───────────────────────────────────────────────────────
[[data]]
kind = "prices"
source = "massive_prices"
lookback_days = 365

[[data]]
kind = "fundamentals"
source = "massive_fundamentals"
lookback_days = 540

[[data]]
kind = "ratios"
source = "valuation_ratios"
window_days = 365
lookback_days = 365

[[data]]
# FRED macro regime: rates, curve, vol, credit, FX, oil, breakeven, labour.
# 90d lookback → the source's `change` field is the 3-month trend, the tactical
# read. Adapter renders all observations compactly; ceiling truncates if needed.
kind = "macro"
source = "fred_macro"
lookback_days = 90

[[data]]
# Computed from news: 90-point daily sentiment series (score + count per day).
# The quantitative sentiment trend over 3 months — replaces reading hundreds of
# raw headlines. Computed kind; upstream `news` must be bound (it is, below).
kind = "news_sentiment"
source = "news_sentiment"
lookback_days = 90

# ── qualitative lane ────────────────────────────────────────────────────────
[[data]]
# Recent news context only — 14d. The mission de-emphasizes momentum, so this
# is supporting context (qualify/sharpen the fundamental picture), not a driver.
# Adapter renders every article in the window; the context-budget ceiling handles
# high-coverage names (NVDA).
kind = "news"
source = "massive_news"
lookback_days = 14

[[data]]
# Web search, two-tier (adapter owns the plan): structural queries (business
# model, competitive position, risk, strategy) over 30d, plus an updates
# query over the last 7d. Replaces the 10-K filing text with fresher, deeper
# structured context (guidance tables, segment breakdowns). Overlaps with
# `news` (14d) by design. The binding lookback sets the structural tier.
kind = "web_search"
source = "web_search"
lookback_days = 30
max_results = 5
# Platform default is true; spelled here so packages see the PIT knob.
# Brave freshness is soft — clamp_by_age drops results whose sources[url].age
# falls outside the search window (undated kept).
clamp_by_age = true

[scoring]
# The signal: how the decision's metrics become THE signal. For a single-name
# strategy the view's score is the signal. The platform owns the mechanics
# around it (transform, ensemble, holdings); the package owns what the
# signal *is*. See docs/architecture.md §1 + the evaluation layer.
signal = "single_name"
# The KPI: what "good" means over signal + prices. single_name_ir reports
# Spearman + Pearson IC at every horizon (mean, raw ICIR, ICIR × √ppy) plus
# net-of-cost returns from the holdings layer (PW / SW / EW longs / naive tilt / MVO).
kpi = "single_name_ir"
metric_key = "icir"
transform = "single_name"
# Horizons are decision-date-grid steps (fortnights on this biweekly grid): [1, 2, 4, 8].
# These are the measurable forward returns the KPI scores — they do NOT represent
# the agent's view horizon (a fundamental trajectory plays out over quarters).
# The agent's fundamental view is the signal; it is scored on whatever forward
# grid exists. 8 steps needs i+8 < 32 → 24 dated.
horizons = [1, 2, 4, 8]

[scoring.params]
holdings = true
active_budget = 0.5
cost_bps = 5.0
long_thresholds = [0.0, 0.3]
books = ["pw", "sw_long", "ew_long", "naive_tilt", "mvo"]

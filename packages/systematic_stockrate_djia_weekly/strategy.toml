# systematic_stockrate_djia_weekly — DJIA single-ticker systematic stock rating,
# weekly assessment cadence, fundamental attractiveness + trajectory view.
#
# Sibling of systematic_stockrate_djia (the quarterly package). Same single-ticker
# pattern — one agent call per (decision_date, ticker) — scored with
# single_name_ir. Intentional differences from the quarterly package:
#   * the decision grid is weekly (Fridays, holiday-snapped forward) over
#     2026-04-24 .. 2026-07-31 — the cadence of assessment, not the view horizon
#   * the mission asks for a fundamental attractiveness + trajectory rating
#     (no fixed horizon, explicitly not a momentum call); the output schema's
#     default time_horizon is "quarter"
#   * scoring horizons are decision-date-grid steps (weeks): [1, 2, 4, 8].
#     These do NOT represent the agent's view horizon — the window is too short
#     to measure a multi-quarter fundamental trajectory. They are the measurable
#     forward grid the KPI can score; the agent's fundamental view is the signal,
#     scored on whatever forward grid exists.
#   * the data surface is tuned for a fundamental/trajectory view at weekly
#     cadence: lookbacks are the deliberate signal filter (the adapter renders ALL
#     data in each window; a single context-budget ceiling truncates only at
#     the limit). Macro (FRED) and news_sentiment are added; news is trimmed to
#     recent context only. Filing text is left out for now (fundamentals +
#     ratios already carry the quantitative essence; the qualitative business
#     narrative can be wired back in later if the rating needs it).
#
# Data surface partitioning (adapter owns):
#   quantitative specialist ← prices + fundamentals + ratios + macro + news_sentiment
#   qualitative specialist  ← news + web_search

schema_version = 1
name = "systematic_stockrate_djia_weekly"
description = "Score each DJIA-30 constituent independently, weekly (2026-04-24 to 2026-07-31), scored via pooled single-name IR."

[universe]
preset = "dow30"

[decision]
scope = "single_name"
# Weekly Fridays over 2026-04-24 .. 2026-07-31, snapped forward to the next
# trading day when the Friday is an NYSE holiday (Juneteenth → 2026-06-22;
# observed Independence Day → 2026-07-06). There is no builtin `weekly` schedule
# kind, so the grid is expressed as custom_dates; the dates are the source of
# truth — `--start/--end` may narrow but not widen them.
schedule = { kind = "custom_dates", start = "2026-04-24", end = "2026-07-31", dates = [
    "2026-04-24", "2026-05-01", "2026-05-08", "2026-05-15", "2026-05-22",
    "2026-05-29", "2026-06-05", "2026-06-12", "2026-06-22", "2026-06-26",
    "2026-07-06", "2026-07-10", "2026-07-17", "2026-07-24", "2026-07-31",
] }

# ── quantitative lane ───────────────────────────────────────────────────────
[[data]]
kind = "prices"
source = "massive_prices"
lookback_days = 365

[[data]]
kind = "fundamentals"
source = "massive_fundamentals"
lookback_days = 540

[[data]]
kind = "ratios"
source = "valuation_ratios"
window_days = 365
lookback_days = 365

[[data]]
# FRED macro regime: rates, curve, vol, credit, FX, oil, breakeven, labour.
# 90d lookback → the source's `change` field is the 3-month trend, the tactical
# read. Adapter renders all observations compactly; ceiling truncates if needed.
kind = "macro"
source = "fred_macro"
lookback_days = 90

[[data]]
# Computed from news: 90-point daily sentiment series (score + count per day).
# The quantitative sentiment trend over 3 months — replaces reading hundreds of
# raw headlines. Computed kind; upstream `news` must be bound (it is, below).
kind = "news_sentiment"
source = "news_sentiment"
lookback_days = 90

# ── qualitative lane ────────────────────────────────────────────────────────
[[data]]
# Recent news context only — 14d. The mission de-emphasizes momentum, so this
# is supporting context (qualify/sharpen the fundamental picture), not a driver.
# Adapter renders every article in the window; the context-budget ceiling handles
# high-coverage names (NVDA).
kind = "news"
source = "massive_news"
lookback_days = 14

[[data]]
# Web search, two-tier (adapter owns the plan): structural queries (business
# model, competitive position, risk, strategy) over 30d, plus an updates
# query over the last 7d. Replaces the 10-K filing text with fresher, deeper
# structured context (guidance tables, segment breakdowns). Overlaps with
# `news` (14d) by design. The binding lookback sets the structural tier.
kind = "web_search"
source = "web_search"
lookback_days = 30
max_results = 5
# Platform default is true; spelled here so packages see the PIT knob.
# Brave freshness is soft — clamp_by_age drops results whose sources[url].age
# falls outside the search window (undated kept).
clamp_by_age = true

[scoring]
# The signal: how the decision's metrics become THE signal. For a single-name
# strategy the view's score is the signal. The platform owns the mechanics
# around it (transform, ensemble, holdings); the package owns what the
# signal *is*. See docs/architecture.md §1 + the evaluation layer.
signal = "single_name"
# The KPI: what "good" means over signal + prices. single_name_ir reports raw
# cross-sectional IC (Spearman, per decision-date grid) plus net-of-cost
# returns from the holdings layer.
kpi = "single_name_ir"
metric_key = "icir"
transform = "single_name"
# Horizons are decision-date-grid steps (weeks on this weekly grid): [1, 2, 4, 8].
# These are the measurable forward returns the KPI scores — they do NOT represent
# the agent's view horizon (a fundamental trajectory plays out over quarters,
# and the Apr-Jul window is too short to measure that). The agent's fundamental
# view is the signal; it is scored on whatever forward grid exists. 8 weeks
# needs i+8 < 15 → 7 dated.
horizons = [1, 2, 4, 8]
params = { holdings = true, active_budget = 0.5, cost_bps = 5.0 }

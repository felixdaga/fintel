[project]
name = "fintel"
version = "0.1.0"
description = "Agent evaluation where the benchmark is an investment outcome."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3",
    "pandas>=2.1,<2.3",
    "numpy>=1.26,<2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "python-dateutil>=2.8",
]

[project.scripts]
fintel = "fintel.cli.main:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2", "psutil>=5.9"]
massive = ["httpx>=0.27"]
llm = ["litellm>=1.90"]
dev = ["pytest>=7,<9", "ruff>=0.4", "httpx>=0.27", "mcp>=1.2,<2", "psutil>=5.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintel*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "fintel"
version = "0.1.0"
description = "Agent evaluation where the benchmark is an investment outcome."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5,<3",
    "pandas>=2.1,<2.3",
    "numpy>=1.26,<2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/felixdaga/fintel"
Repository = "https://github.com/felixdaga/fintel"

[project.scripts]
fintel = "fintel.cli.main:main"

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2", "psutil>=5.9"]
massive = ["httpx>=0.27"]
llm = ["litellm>=1.90"]
eval = ["cvxpy>=1.4"]
dev = ["pytest>=7,<9", "ruff>=0.4", "httpx>=0.27", "mcp>=1.2,<2", "psutil>=5.9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fintel*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Stylistic rules the pre-existing codebase does not follow; relax until a
# dedicated cleanup pass. F (real bugs) and I (imports) stay enforced.
ignore = ["E501", "E731", "E741", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
